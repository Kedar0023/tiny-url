
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tiny URL — Short links, big possibilities</title>

  <style>
    :root {
      --bg: #faf9f7;
      --surface: #ffffff;
      --text: #191919;
      --muted: #858585;
      --border: #e9e7e3;
      --accent: #6558e8;
      --accent-hover: #5145d0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Inter, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(100% - 40px, 1080px);
      margin-inline: auto;
    }

    /* Navigation */

    header {
      padding: 25px 0;
      border-bottom: 1px solid var(--border);
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 21px;
      font-weight: 750;
      letter-spacing: -0.8px;
    }

    .brand-icon {
      width: 35px;
      height: 35px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: var(--accent);
      color: white;
      font-size: 22px;
    }

    .nav-right {
      color: var(--muted);
      font-size: 13px;
    }

    /* Main content */

    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 76px 0 90px;
    }

    .hero {
      width: 100%;
      max-width: 650px;
      margin-inline: auto;
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 13px;
      border: 1px solid #e5e0ff;
      border-radius: 30px;
      background: #f2efff;
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
    }

    .eyebrow-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }

    h1 {
      margin-top: 25px;
      font-size: clamp(38px, 6vw, 60px);
      line-height: 1.08;
      letter-spacing: -3px;
      font-weight: 750;
    }

    h1 span {
      color: var(--accent);
    }

    .subtitle {
      max-width: 420px;
      margin: 20px auto 38px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.8;
    }

    /* URL form */

    .url-card {
      padding: 25px;
      text-align: left;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 12px 40px rgb(0 0 0 / 3%);
    }

    .field-label {
      display: block;
      margin-bottom: 12px;
      font-size: 13px;
      font-weight: 650;
    }

    .url-input {
      width: 100%;
      min-height: 54px;
      padding: 0 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      background: #fdfdfc;
      color: var(--text);
      font: inherit;
      font-size: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .url-input::placeholder {
      color: #b4b2ae;
    }

    .url-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgb(101 88 232 / 10%);
    }

    .create-btn {
      width: 100%;
      min-height: 52px;
      margin-top: 13px;
      border: none;
      border-radius: 10px;
      background: var(--text);
      color: white;
      font: inherit;
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    .create-btn:hover {
      background: var(--accent);
      transform: translateY(-1px);
    }

    .helper {
      margin-top: 15px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }

    /* Example result */

    .result-card {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 18px;
      padding: 19px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      text-align: left;
    }

    .result-card[hidden] {
      display: none;
    }

    .link-icon {
      flex-shrink: 0;
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: #f1efff;
      color: var(--accent);
      font-size: 21px;
    }

    .result-info {
      flex: 1;
      min-width: 0;
    }

    .result-label {
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .short-url {
      color: var(--accent);
      font-size: 14px;
      font-weight: 650;
      overflow-wrap: anywhere;
    }

    .copy-btn {
      flex-shrink: 0;
      padding: 9px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: white;
      color: var(--text);
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .copy-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Footer */

    footer {
      padding: 24px 0;
      border-top: 1px solid var(--border);
    }

    .footer-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      color: var(--muted);
      font-size: 12px;
    }

    .footer-brand {
      color: var(--text);
      font-weight: 650;
    }

    @media (max-width: 520px) {
      .container {
        width: min(100% - 30px, 1080px);
      }

      header {
        padding: 19px 0;
      }

      .nav-right {
        font-size: 11px;
      }

      main {
        padding: 65px 0;
      }

      h1 {
        letter-spacing: -1.8px;
      }

      .subtitle {
        font-size: 14px;
      }

      .url-card {
        padding: 18px;
      }

      .result-card {
        gap: 10px;
        padding: 14px;
      }

      .link-icon {
        width: 36px;
        height: 36px;
      }

      .copy-btn {
        padding: 8px 10px;
      }

      .footer-inner {
        flex-direction: column;
        text-align: center;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="container">
      <nav>
        <a class="brand" href="/" aria-label="Tiny URL home">
          <span class="brand-icon" aria-hidden="true">↗</span>
          <span>Tiny URL</span>
        </a>

        <div class="nav-right">Simple links. Less clutter.</div>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero container">
      <h1>
        Short links,<br />
        <span>big possibilities.</span>
      </h1>

      <p class="subtitle">
        Turn long, messy URLs into tiny links that are
        easy to share, remember, and manage.
      </p>

      <form class="url-card" id="shorten-form">
        <label class="field-label" for="long-url">
          Paste your long URL
        </label>

        <input
          class="url-input"
          id="long-url"
          name="url"
          type="url"
          placeholder="https://example.com/your-very-long-url"
          required
        />

        <button class="create-btn" type="submit">
          Create short link &nbsp; →
        </button>

        <p class="helper" id="form-status" role="status" aria-live="polite">
          Free to use. No complicated setup.
        </p>
      </form>

      <div class="result-card" id="result-card" hidden>
        <div class="link-icon" aria-hidden="true">↗</div>

        <div class="result-info">
          <p class="result-label">YOUR SHORT LINK</p>
          <a class="short-url" id="short-url" href="#"></a>
        </div>

        <button class="copy-btn" id="copy-button" type="button">Copy</button>
      </div>
    </section>
  </main>

  <script>
    const form = document.querySelector("#shorten-form");
    const input = document.querySelector("#long-url");
    const status = document.querySelector("#form-status");
    const resultCard = document.querySelector("#result-card");
    const shortUrl = document.querySelector("#short-url");
    const copyButton = document.querySelector("#copy-button");
    const createButton = form.querySelector(".create-btn");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      resultCard.hidden = true;
      status.textContent = "Creating your short link...";
      createButton.disabled = true;

      try {
        const response = await fetch("/api/v1/shorten", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ long_url: input.value.trim() }),
        });
        const data = await response.json().catch(() => ({}));

        if (!response.ok || typeof data.short_url !== "string") {
          throw new Error(data.error || "Unable to create a short link.");
        }

        shortUrl.href = data.short_url;
        shortUrl.textContent = data.short_url;
        resultCard.hidden = false;
        status.textContent = "Your short link is ready.";
      } catch (error) {
        status.textContent = error.message || "Unable to create a short link.";
      } finally {
        createButton.disabled = false;
      }
    });

    copyButton.addEventListener("click", async () => {
      await navigator.clipboard.writeText(shortUrl.href);
      copyButton.textContent = "Copied";
      window.setTimeout(() => {
        copyButton.textContent = "Copy";
      }, 1500);
    });
  </script>
</body>
</html>
